name: Build

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Extract version
        id: version
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/version *= *"\(.*\)"/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build release
        run: cargo build --release
      - name: Generate extension
        run: |
          python3 scripts/metadata.py \
            --extension-version "${{ steps.version.outputs.version }}" \
            target/release/libgigatoken.so \
            -o gigatoken.duckdb_extension
      - name: Verify extension
        run: |
          file gigatoken.duckdb_extension
          ls -lh gigatoken.duckdb_extension

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Extract version
        id: version
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/version *= *"\(.*\)"/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build release
        run: cargo build --release
      - name: Generate extension
        run: |
          python3 scripts/metadata.py \
            --extension-version "${{ steps.version.outputs.version }}" \
            target/release/libgigatoken.dylib \
            -o gigatoken.duckdb_extension
      - name: Verify extension
        run: |
          file gigatoken.duckdb_extension
          ls -lh gigatoken.duckdb_extension

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Extract version
        id: version
        shell: bash
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/version *= *"\(.*\)"/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT
      - name: Build release
        run: cargo build --release
      - name: Generate extension
        shell: bash
        run: |
          python3 scripts/metadata.py \
            --extension-version "${{ steps.version.outputs.version }}" \
            target/release/gigatoken.dll \
            -o gigatoken.duckdb_extension
      - name: Verify extension
        run: dir gigatoken.duckdb_extension
